<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Notes - No More Asking for Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">📒 Smart Notes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Note Input Form -->
    <div class="container mt-4">
        <div class="card shadow-lg p-4">
            <h2 class="text-center">📝 Add a New Note</h2>
            <form action="/" method="post">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="desc" rows="3" required></textarea>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="important">
                    <label class="form-check-label">Mark as Important</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Note</button>
            </form>
        </div>
    </div>

    <!-- Display Notes -->
    <div class="container mt-4">
        <h2 class="text-center">📌 Your Notes</h2>

        {% if not newDocs %}
            <p class="text-center text-muted">No notes to display. Start adding some!</p>
        {% else %}
            <div class="row">
                {% for item in newDocs %}
                <div class="col-md-4">
                    <div class="card mb-3 shadow">
                        <div class="card-body">
                            <h5 class="card-title">{{ item.title }}</h5>
                            <p class="card-text">{{ item.desc }}</p>
                            <span class="badge {% if item.important %}bg-danger{% else %}bg-secondary{% endif %}">
                                {% if item.important %}🔥 Important{% else %}📄 Normal{% endif %}
                            </span>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
